[project]
name = "azzurro-reviews"
version = "0.1.0"
description = "Collects Booking.com reviews for four Sydney properties and serves review insights"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.48",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
